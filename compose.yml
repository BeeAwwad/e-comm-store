services:
  postgres:
    image: postgres:17-alpine
    container_name: clothing-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clothing_store
      POSTGRES_PASSWORD: clothing_store_dev
      POSTGRES_DB: clothing_store
    ports:
      - "5432:5432"
    volumes:
      - clothing_store_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothing_store -d clothing_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clothing_store_data:
